name: Update weather data

on:
  schedule:
    - cron: "30 11 * * *"   # daily, 11:30 UTC (early morning in Kentucky and Arizona)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Fetch weather data
        env:
          REGION: ky
        run: python scripts/update_data.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/data.txt; then
            echo "No change"; exit 0
          fi
          git config user.name "crop-weather-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.txt
          git commit -m "Update weather data $(date -u +%Y-%m-%d)"
          git push
